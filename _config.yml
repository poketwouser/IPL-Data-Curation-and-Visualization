title: IPL Intelligence Platform
description: Premium IPL analytics dashboard built with Dash & Plotly.
theme: jekyll-theme-cayman

# The README is rendered as the site landing page. The items below are the
# Python/Dash application source and data — they are not part of the static
# site, so we keep them out of the built output.
exclude:
  - app.py
  - api/
  - pages/
  - utils/
  - scripts/
  - tests/
  - scratch/
  - assets/
  - data/
  - __pycache__/
  - Dockerfile
  - Procfile
  - runtime.txt
  - requirements.txt
  - vercel.json
